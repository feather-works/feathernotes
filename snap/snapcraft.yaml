name: feather-notes # "feathernotes" já estava reservado por outra pessoa na loja
title: FeatherNotes
base: core26 # mesma base e mesma placa de vídeo (gpu-2604) do snap do FeatherSheet
version: '0.1.16' # trocar junto com a tag em `source:` a cada versão
summary: Light notepad with Markdown and desktop sticky notes
description: |
  A notepad written in Rust with a native interface. Tabs that come back
  as you left them (unsaved changes included), find and replace, Markdown
  with clickable tasks, 30+ encodings with repair of broken accents, and
  sticky notes on the desktop with colors and a trash list.
  Everything runs on your machine: no account, no login, no telemetry.
license: GPL-3.0-only
website: https://github.com/feather-works/feathernotes
issues: https://github.com/feather-works/feathernotes/issues
source-code: https://github.com/feather-works/feathernotes
contact: https://github.com/feather-works/feathernotes/issues
icon: pacote/icones/feathernotes-512.png
grade: stable
confinement: strict
platforms:
  amd64:

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2604/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2604/drirc.d
  # O Compose do pt_BR inclui o do en_US por caminho absoluto (acentos com tecla morta).
  /usr/share/X11/locale:
    bind: $SNAP/gpu-2604/mesa-2604/usr/share/X11/locale

apps:
  feather-notes:
    command: usr/bin/feathernotes
    command-chain: [bin/gpu-2604-wrapper, bin/janela.sh]
    desktop: usr/share/applications/feathernotes.desktop
    common-id: feathernotes
    autostart: feathernotes.desktop # "Abrir ao entrar no sistema" grava em ~/snap/feathernotes/current/.config/autostart
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - removable-media # arquivos em /media e /run/media

parts:
  feather-notes:
    # Reaproveita o .deb da release (feito pelo pacote/gerar.sh), sem recompilar.
    plugin: dump
    source: https://github.com/feather-works/feathernotes/releases/download/v0.1.16/feathernotes-linux-amd64.deb
    source-type: deb
    # Bibliotecas que o winit/wgpu e as fontes abrem por dlopen.
    stage-packages:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libvulkan1
      - libfontconfig1
    override-build: |
      craftctl default
      sed -i 's#^Icon=.*#Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/feathernotes.png#' \
        ${CRAFT_PART_INSTALL}/usr/share/applications/feathernotes.desktop

  janela:
    plugin: dump
    source: snap/local
    organize:
      janela.sh: bin/janela.sh

  gpu-2604:
    after: [feather-notes]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2604-cleanup mesa-2604
    prime:
      - bin/gpu-2604-wrapper
