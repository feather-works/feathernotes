[package]
name = "feathernotes"
version = "0.1.8"
description = "Bloco de notas simples da suíte FeatherWorks"
authors = ["FeatherWorks"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/feather-works/feathernotes"
publish = false

[dependencies]
pelicano = { git = "https://github.com/feather-works/pelicano", tag = "v0.1.14" }
rfd = "0.16"
dirs = "6"
# Codificações legadas (Windows-125x, ISO-8859, CJK, KOI8…) e o palpite de qual é a de um arquivo.
encoding_rs = "0.8"
chardetng = "0.1"
# Links falsos: letras que se confundem (TR39 do Unicode), o nome de cada uma e o endereço em punycode.
unicode-security = "0.1"
unicode_names2 = "2"
idna = "1"

[build-dependencies]
# Ícone e nome do .exe do Windows (build.rs).
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
# RAM e CPU no rodapé.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
